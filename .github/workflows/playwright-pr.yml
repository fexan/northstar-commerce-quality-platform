name: Playwright PR checks

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medusa
      STORE_CORS: http://127.0.0.1:8000,http://localhost:8000
      ADMIN_CORS: http://127.0.0.1:9000,http://localhost:9000
      AUTH_CORS: http://127.0.0.1:8000,http://localhost:8000
      JWT_SECRET: ci-jwt-secret
      COOKIE_SECRET: ci-cookie-secret
      STOREFRONT_BASE_URL: http://127.0.0.1:8000
      MEDUSA_BACKEND_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_DEFAULT_REGION: dk
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            my-medusa-store/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix my-medusa-store
      - name: Static checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Prepare Medusa database
        working-directory: my-medusa-store/apps/backend
        run: |
          npx medusa db:migrate
          npx medusa exec ./src/migration-scripts/initial-data-seed.ts
          while IFS='=' read -r name value; do
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done < .medusa-ci-keys
          rm -f .medusa-ci-keys
      - name: Start application
        run: npm run dev --prefix my-medusa-store > automation-app.log 2>&1 &
      - name: Wait for application
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:9000/health; do sleep 2; done'
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8000/dk; do sleep 2; done'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run API and Chromium smoke tests
        run: npx playwright test --project=chromium --grep '@api|@smoke'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-report
          path: automation/playwright-report
          retention-days: 14
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-failure-evidence
          path: |
            automation/test-results
            automation-app.log
          retention-days: 14
